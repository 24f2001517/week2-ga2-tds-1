services:
  - type: web
    name: fastapi-middleware-service
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: EMAIL
        sync: false
      - key: EXAM_ORIGIN
        sync: false
